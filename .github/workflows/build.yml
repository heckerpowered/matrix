# Automatically build the project and run any configured tests for every push
# and submitted pull request. This can help catch issues that only occur on
# certain platforms or Java versions, and provides a first line of defence
# against bad commits.

name: build
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    strategy:
      matrix:
        # Use these Java versions
        java: [
          21,    # Current Java LTS
        ]
        # and run on both Linux and Windows
        os: [ ubuntu-latest, windows-latest, macos-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
      - name: setup jdk ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: 'microsoft'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: make gradle wrapper executable
        if: ${{ runner.os != 'Windows' }}
        run: chmod +x ./gradlew
      - name: Build with Gradle
        run: ./gradlew build
      - name: Capture build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ runner.os }}
          path: build/libs/

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Rename assets with platform suffix
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          for dir in dist/artifacts-*; do
            [ -d "$dir" ] || continue

            base="$(basename "$dir")"        # e.g. artifacts-Windows
            suffix="${base#*-}"              # → Windows / Linux / macOS
            suffix="${suffix,,}"

            for f in "$dir"/*; do
              [ -e "$f" ] || continue
              filename="$(basename "$f")"
              if [[ "$filename" == *.* ]]; then
                ext=".${filename##*.}"
                stem="${filename%.*}"
              else
                ext=""
                stem="$filename"
              fi
              mv -- "$f" "$dir/${stem}-${suffix}${ext}"
            done
          done

      - name: Compute release tag
        id: tag
        run: |
          MC_VERSION=$(grep '^minecraftVersion=' gradle.properties | cut -d'=' -f2)
          YEAR=$(date -u +%y)   # 2025 -> 25

          MAJOR=1
          MINOR=0

          SHORT=${GITHUB_SHA::7}

          TAG="mc${MC_VERSION}-v${YEAR}.${MAJOR}.${MINOR}-${SHORT}"
          echo "TAG=$TAG" >> $GITHUB_OUTPUT
          echo "Generated tag: $TAG"

      - name: Create tag in repo
        uses: actions/github-script@v7
        with:
          script: |
            const tag = '${{ steps.tag.outputs.TAG }}';
            try {
              await github.rest.git.createRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `refs/tags/${tag}`,
                sha: context.sha
              });
            } catch (e) {
              if (e.status !== 422) throw e;
            }

      - name: Publish drafted release
        uses: release-drafter/release-drafter@v6
        with:
          publish: false
          tag: ${{ steps.tag.outputs.TAG }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload assets to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/**/*
          draft: false
          prerelease: false
          tag_name: ${{ steps.tag.outputs.TAG }}
          allowUpdates: true
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
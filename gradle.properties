# jdk.net.unixdomain.tmpdir: machine-local workaround, see ~/.gradle/gradle.properties —
# AF_UNIX sockets cannot be created in %TEMP% (blocked by security software), which breaks
# the java.nio Selector/Pipe used by Gradle and the Kotlin daemon.
org.gradle.jvmargs=-Xms1g -Xmx4g -XX:+UseParallelGC -Djdk.net.unixdomain.tmpdir=C:/Users/Zopiclone/.uds-tmp
org.gradle.parallel=true
org.gradle.daemon=true
org.gradle.caching=true
# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false
org.gradle.vfs.watch=true
org.gradle.daemon.idletimeout=900000
